[workspace]
resolver = "2"
members = [
    "crates/domain/core",
    "crates/adapters/io",
    "crates/domain/coverage",
    "crates/plugins/order",
    "crates/plugins/decompose",
    "crates/adapters/viz",
    "crates/plugins/improve",
    "crates/plugins/assign",
    "crates/plugins/polish",
    "crates/app/pipeline",
    "crates/adapters/verify",
    "crates/adapters/store",
    "crates/adapters/cpsat",
    "crates/app/report",
    "crates/app/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[workspace.dependencies]
mow-core = { path = "crates/domain/core" }
mow-io = { path = "crates/adapters/io" }
mow-coverage = { path = "crates/domain/coverage" }
mow-order = { path = "crates/plugins/order" }
mow-decompose = { path = "crates/plugins/decompose" }
mow-viz = { path = "crates/adapters/viz" }
mow-cpsat = { path = "crates/adapters/cpsat" }
mow-improve = { path = "crates/plugins/improve" }
mow-assign = { path = "crates/plugins/assign" }
mow-polish = { path = "crates/plugins/polish" }
mow-pipeline = { path = "crates/app/pipeline" }
mow-verify = { path = "crates/adapters/verify" }
mow-store = { path = "crates/adapters/store" }
mow-report = { path = "crates/app/report" }
mow-cli = { path = "crates/app/cli" }

thiserror = "1.0.69"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
rand = { version = "0.8.5", default-features = false, features = ["std", "small_rng"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = 1
