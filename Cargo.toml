[workspace]
resolver = "2"
members = [
    "crates/domain/core",
    "crates/adapters/io",
    "crates/domain/coverage",
    "crates/plugins/order",
    "crates/plugins/decompose",
    "crates/adapters/viz",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[workspace.dependencies]
mow-core = { path = "crates/domain/core" }
mow-io = { path = "crates/adapters/io" }
mow-coverage = { path = "crates/domain/coverage" }
mow-order = { path = "crates/plugins/order" }
mow-decompose = { path = "crates/plugins/decompose" }
mow-viz = { path = "crates/adapters/viz" }

thiserror = "1.0.69"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
rand = { version = "0.8.5", default-features = false, features = ["std", "small_rng"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = 1
